name: Weekend reminders

on:
  schedule:
    # Hourly from Friday evening UTC through Monday's small hours, which covers
    # Friday afternoon, Saturday night and Sunday evening in any US time zone.
    # The script decides which run is the right local moment and which of the
    # three stages it is, so daylight saving never needs a cron edit.
    - cron: '0 18-23 * * 5'
    - cron: '0 * * * 6'
    - cron: '0 * * * 0'
    - cron: '0 0-4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send now, ignoring the schedule and the already-sent marker'
        type: boolean
        default: true
      stage:
        description: 'Which reminder to send (blank = whatever fits the current time)'
        type: choice
        options: ['', 'friday', 'saturday', 'sunday']
        default: ''

permissions:
  contents: write

concurrency:
  group: cleanit-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the data (this repo)
        uses: actions/checkout@v4
        with:
          # Full history so the rebase below works if a chore was checked off
          # while this job was running.
          fetch-depth: 0

      - name: Check out the app code
        uses: actions/checkout@v4
        with:
          repository: __APP_REPO__
          path: .app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .app/package-lock.json

      - run: npm ci --omit=dev
        working-directory: .app

      - name: Send reminders
        env:
          CLEANIT_DATA_DIR: ${{ github.workspace }}/data
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CLEANIT_URL: ${{ vars.CLEANIT_URL }}
        run: |
          node .app/scripts/send-reminders.mjs \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.stage && format('--stage={0}', inputs.stage) || '' }}

      - name: Record what was sent
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  'cleanit[bot]'
            git config user.email 'cleanit[bot]@users.noreply.github.com'
            git add data/
            git commit -m 'Record weekend reminders'
            # Someone may have checked off a chore while this job ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Nothing to record.'
          fi
