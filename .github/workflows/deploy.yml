name: Deploy to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Checking off a chore rewrites data/ constantly; those commits do not
      # change the site, and redeploying on each one just burns Actions time.
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js schedule.js config.js sw.js manifest.webmanifest _site/
          cp -r icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
