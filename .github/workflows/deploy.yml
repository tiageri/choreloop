name: Deploy to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Checking off a chore rewrites data/ constantly; those commits do not
      # change the site, and redeploying on each one just burns Actions time.
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        # Copy by exclusion, not by listing every file: an allowlist silently
        # drops newly added modules, and a missing import breaks the whole app.
        # data/ is excluded here, which is what keeps chore data off the site.
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'scripts/' \
            --exclude 'template/' \
            --exclude 'data/' \
            --exclude '_site/' \
            --exclude '.preview-data/' \
            --exclude 'config.local.js' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'README.md' \
            --exclude '.gitignore'
          touch _site/.nojekyll
          echo 'Publishing:' && find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
